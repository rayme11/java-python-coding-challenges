name: Azure AI QE Lab CI

on:
  push:
    branches: [ feature/azure-ai-qe-implementation ]
  pull_request:
    branches: [ feature/azure-ai-qe-implementation ]

jobs:
  azure-qe-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r azure-ai-qe-lab/requirements.txt
        playwright install chromium

    - name: Run Python API Tests
      run: |
        pytest azure-ai-qe-lab/tests/test_api_rest.py

    - name: Run AI Governance Scripts
      run: |
        python azure-ai-qe-lab/ai_governance/data_synthesizer.py
        python azure-ai-qe-lab/ai_governance/llm_judge.py
